services:
  redis:
    image: redis:7-alpine
    container_name: tripbudget-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  realtime-proxy:
    image: nginx:alpine
    profiles: [realtime]
    ports:
      - "8080:80"
    volumes:
      - ./dev/nginx-realtime.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
