spring:
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trip_core
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

security:
  jwt:
    secret: ${JWT_ACCESS_SECRET}

hashids:
  salt: ${HASHIDS_SALT:6d8a1d503a90486cd6cef4fb216faabf}
  min-length: ${HASHIDS_MIN_LENGTH:8}

server:
  servlet:
    context-path: ${API_BASE_PATH:/api}
  port: ${PORT:8081}

maps:
  vietmap:
    api-key: ${VIETMAP_API_KEY:}
    max-points: ${VIETMAP_MATRIX_MAX_POINTS:10}
  osm:
    photon-url: ${OSM_PHOTON_URL:https://photon.komoot.io/api/}
    routing-url: ${OSM_ROUTING_URL:https://routing.openstreetmap.de/routed-car}
  require-https: ${MAPS_REQUIRE_HTTPS:false}
  trust-proxy: ${MAPS_TRUST_PROXY:false}
