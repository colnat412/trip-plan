spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trip_core
    open-in-view: false

security:
  jwt:
    secret: ${JWT_ACCESS_SECRET}

hashids:
  salt: ${HASHIDS_SALT:6d8a1d503a90486cd6cef4fb216faabf}
  min-length: ${HASHIDS_MIN_LENGTH:8}

server:
  servlet:
    context-path: ${API_BASE_PATH:/api}
  port: ${PORT:8081}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:}

# One Core instance; route /realtime to this service through a same-origin proxy.
app:
  web-origin: ${APP_WEB_ORIGIN:http://localhost:8080}
notifications:
  dispatch-delay-ms: ${NOTIFICATION_DISPATCH_DELAY_MS:1000}
